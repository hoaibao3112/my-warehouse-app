<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mất kết nối - Express Cafe</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9fafb;
            color: #111827;
            text-align: center;
            padding: 20px;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            color: #9ca3af;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 12px 0;
        }
        p {
            color: #4b5563;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }
        button {
            background-color: #000000;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 12l2 2m0 0l2-2m-2 2v-6" />
        <line x1="3" y1="3" x2="21" y2="21" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
    </svg>
    
    <h1>Bạn đang offline</h1>
    <p>Không thể tải trang này do mất kết nối mạng. Vui lòng kiểm tra lại đường truyền.</p>
    
    <button onclick="window.location.reload()">Thử lại</button>

    <script>
        // Check connectivity periodically
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
